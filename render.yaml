services:
  - type: web
    name: studioravya-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STUDIO_ADMIN_PASSWORD
        value: studioravya2026
      - key: CORS_ORIGINS
        value: https://studioravya.onerishi.in,http://localhost:4321,http://localhost:8000
      - key: API_BASE_URL
        value: https://studioravya-backend.onrender.com
